<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="VILLA-METAL | Roteiro Arena">
  <meta property="og:description" content="Roteiro de palco por música da Villa-Metal.">
  <meta property="og:url" content="https://villametal.github.io/villametal/roteiro-arena.html">
  <title>VILLA-METAL | Roteiro Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { color-scheme: dark; }
    body { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    header { position: sticky; top: 0; z-index: 1000; }
    .backstage-button { background: linear-gradient(45deg,#dc2626,#f59e0b); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .arena-table { border:1px solid #374151; border-radius:12px; overflow:hidden; background:rgba(31,41,55,.5); }
    .arena-head, .arena-row { display:grid; grid-template-columns:minmax(150px, 1fr) minmax(0, 3fr) minmax(130px, .8fr); }
    .arena-head { background:rgba(17,24,39,.92); color:#f87171; font-weight:700; }
    .arena-head > div, .arena-row > div { padding:12px 16px; min-width:0; }
    .arena-head > div + div, .arena-row > div + div { border-left:1px solid #4b5563; }
    .arena-row { background:rgba(31,41,55,.5); border-top:1px solid #4b5563; }
    .arena-row:nth-child(odd) { background:rgba(31,41,55,.72); }
    .song-name { color:#f5d0fe; font-family:'Courier New',monospace; font-weight:700; overflow-wrap:anywhere; }
    .script-input, .obs-input, .song-input { display:block; box-sizing:border-box; width:100%; min-height:74px; resize:none; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere; background:#374151; color:#f9fafb; border:1px solid #6b7280; border-radius:8px; padding:12px; line-height:1.55; }
    .script-input:focus, .obs-input:focus, .song-input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.35); }
    .script-input[readonly], .obs-input[readonly], .song-input[readonly] { cursor:default; opacity:.95; }
    .song-input { min-height:74px; color:#f5d0fe; font-family:'Courier New',monospace; font-weight:700; }
    .login-input { width:100%; max-width:220px; color:#111827; border:1px solid #9ca3af; border-radius:6px; padding:7px 9px; }
    .hidden { display:none !important; }
    #auth-section { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .status { min-height:1.5rem; color:#d1d5db; }
    @media(max-width:700px) {
      header .header-inner { flex-direction:column; gap:12px; }
      #auth-section { justify-content:center; }
      .arena-head, .arena-row { grid-template-columns:minmax(86px,.8fr) minmax(0,2.2fr) minmax(72px,.8fr); }
      .arena-head > div, .arena-row > div { padding:9px 8px; }
      .script-input, .obs-input, .song-input { min-height:90px; padding:9px 7px; font-size:14px; }
      .arena-head { font-size:13px; }
    }
    @media(max-width:420px) {
      .arena-head, .arena-row { grid-template-columns:minmax(72px,.72fr) minmax(0,2fr) minmax(60px,.7fr); }
      .arena-head > div, .arena-row > div { padding:8px 5px; }
      .script-input, .obs-input, .song-input { min-height:84px; padding:7px 5px; font-size:12px; }
      .song-name { font-size:13px; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-100">
  <header class="bg-black/80 backdrop-blur-md shadow-lg">
    <div class="container mx-auto px-4 py-4 header-inner flex flex-col md:flex-row justify-between items-center">
      <a href="https://villametal.github.io/villametal" aria-label="Villa-Metal - início">
        <img src="Logo_Villa-Metal transparent.png" alt="Logo da Villa-Metal" class="w-36 md:w-52">
      </a>
      <nav aria-label="Navegação principal">
        <ul class="flex flex-wrap justify-center gap-2 md:gap-3 text-sm md:text-base">
        </ul>
      </nav>
      <section id="auth-section" aria-label="Acesso administrativo" class="mt-3 md:mt-0">
        <form id="login-form" class="flex flex-col sm:flex-row gap-2 items-center">
          <span class="text-sm text-center">Login de Administrador</span>
          <input id="email" class="login-input" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
          <input id="password" class="login-input" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
          <button id="btn-login" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-md font-semibold" type="submit">Entrar</button>
        </form>
        <div id="admin-panel" class="hidden items-center gap-3">
          <span id="admin-email" class="text-sm"></span>
          <button id="btn-logout" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-md" type="button">Sair</button>
        </div>
      </section>
    </div>
  </header>

  <main class="container mx-auto px-3 md:px-6 py-8 md:py-10">
    <div class="text-center mb-6 md:mb-10">
      <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-red-500 to-yellow-500 bg-clip-text text-transparent">ROTEIRO ARENA</h1>
      <p class="text-gray-400 mt-2">Orientações de palco organizadas por música</p>
    </div>
    <section class="arena-table shadow-xl" aria-label="Roteiro por música">
      <div class="arena-head" role="row"><div role="columnheader"><i class="fas fa-music mr-2"></i>MÚSICA</div><div role="columnheader"><i class="fas fa-scroll mr-2"></i>ROTEIRO</div><div role="columnheader"><i class="fas fa-sticky-note mr-2"></i>OBS.</div></div>
      <div id="arena-rows" aria-live="polite"><p class="p-5 text-center text-gray-300">Carregando informações…</p></div>
      <div id="admin-actions" class="hidden p-4 bg-gray-900/70 flex flex-wrap items-center gap-3">
        <button id="add-row-btn" class="px-5 py-2 bg-red-600 hover:bg-red-700 rounded-md font-bold"><i class="fas fa-plus mr-2"></i>Adicionar linha</button>
        <button id="save-btn" class="px-5 py-2 bg-green-600 hover:bg-green-700 rounded-md font-bold"><i class="fas fa-save mr-2"></i>Salvar alterações</button>
        <button id="reset-btn" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded-md">Descartar alterações</button>
        <span id="save-status" class="status" role="status"></span>
      </div>
    </section>
    <p id="page-status" class="status mt-4 text-center" role="status"></p>
  </main>

  <footer class="bg-black/80 mt-16 py-6">
    <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-center md:text-left"><h2 class="text-xl font-bold bg-gradient-to-r from-red-500 to-yellow-500 bg-clip-text text-transparent">VILLA-METAL</h2><p class="text-gray-400 mt-1 text-sm">Prática de conjunto de Metal da Escola de Música Villa-Lobos</p></div>
      <div class="flex gap-5"><a href="https://www.instagram.com/villametal.emvl" target="_blank" rel="noreferrer" aria-label="Instagram" class="text-gray-400 hover:text-red-500"><i class="fab fa-instagram text-xl"></i></a><a href="https://www.youtube.com/@villametalemvl" target="_blank" rel="noreferrer" aria-label="YouTube" class="text-gray-400 hover:text-red-500"><i class="fab fa-youtube text-xl"></i></a></div>
    </div>
    <p class="border-t border-gray-800 mt-5 pt-4 text-center text-gray-500 text-xs">© 2025 todos os direitos reservados - <a href="https://wa.me/5521989978029" class="text-red-400" target="_blank" rel="noreferrer">Bru Cardoso Coder</a></p>
  </footer>

  <script type="module" src="roteiro-arena.js"></script>
</body>
</html>
